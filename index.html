<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser FPS Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="info">Кликни по экрану для захвата мыши<br>WASD - Движение | Мышь - Обзор | Клик - Стрельба</div>

    <!-- Подключаем Three.js через CDN -->
    
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

     <script>
   // 1. Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

      // 3. Загрузка карты
const loader = new THREE.GLTFLoader();
loader.load('map.glb', function (gltf) {
    const map = gltf.scene;
        map.position.set(0, -0, 0);

    scene.add(map);
}, undefined, function (error) {
    console.error('Ошибка загрузки карты:', error);
});


        // 4. Управление движением (WASD)
        const moveState = { forward: false, backward: false, left: false, right: false };
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.forward = true;
            if (e.code === 'KeyS') moveState.backward = true;
            if (e.code === 'KeyA') moveState.left = true;
            if (e.code === 'KeyD') moveState.right = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveState.forward = false;
            if (e.code === 'KeyS') moveState.backward = false;
            if (e.code === 'KeyA') moveState.left = false;
            if (e.code === 'KeyD') moveState.right = false;
        });

        // Захват мыши для обзора
        document.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                const movementX = e.movementX || e.mozMovementX || 0;
                const movementY = e.movementY || e.mozMovementY || 0;

                euler.y -= movementX * 0.002;
                euler.x -= movementY * 0.002;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        // 5. Стрельба (Raycasting)
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', () => {
            if (document.pointerLockElement === document.body) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit !== floor) {
                        hit.material.color.set(Math.random() * 0xffffff); // Меняет цвет при попадании
                    }
                }
            }
        });

   // Загрузка оружия в руки
let weapon = null;
loader.load('fps_saiga_animations.glb', function (gltf) {
    weapon = gltf.scene;
    weapon.scale.set(0.1, 0.1, 0.1);
    weapon.position.set(0.3, -0.3, -0.5);
    camera.add(weapon);
    scene.add(camera);
}, undefined, function (error) {
    console.error('Ошибка загрузки оружия:', error);
});

         // 6. Игровой цикл
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const speed = 5 * delta;

            const direction = new THREE.Vector3();
            if (moveState.forward) direction.z -= 1;
            if (moveState.backward) direction.z += 1;
            if (moveState.left) direction.x -= 1;
            if (moveState.right) direction.x += 1;
            direction.normalize();

            // Движение относительно направления взгляда камеры
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            camera.position.addScaledVector(forward, -direction.z * speed);
            camera.position.addScaledVector(right, direction.x * speed);
            camera.position.y = 1.6; // Фиксируем высоту глаз

            renderer.render(scene, camera);
        }
        animate();

        // Адаптация под размер окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body><!-- Сенсорные кнопки для телефона -->
<style>
    .mob-btn {
        position: absolute;
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid white;
        border-radius: 50%;
        color: white;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        z-index: 100;
    }
    #btnForward { bottom: 140px; left: 80px; }
    #btnLeft { bottom: 70px; left: 10px; }
    #btnBack { bottom: 70px; left: 80px; }
    #btnRight { bottom: 70px; left: 150px; }
    #btnShoot { bottom: 70px; right: 20px; width: 80px; height: 80px; background: rgba(255, 0, 0, 0.5); border-radius: 50%; }
</style>

<div id="btnForward" class="mob-btn">W</div>
<div id="btnLeft" class="mob-btn">A</div>
<div id="btnBack" class="mob-btn">S</div>
<div id="btnRight" class="mob-btn">D</div>
<div id="btnShoot" class="mob-btn">FIRE</div>

<script>
    // Обработка нажатий на сенсорные кнопки
    function bindTouchButton(id, stateKey) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[stateKey] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[stateKey] = false; });
    }
    bindTouchButton('btnForward', 'forward');
    bindTouchButton('btnBack', 'backward');
    bindTouchButton('btnLeft', 'left');
    bindTouchButton('btnRight', 'right');

    // Кнопка стрельбы с телефона
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => {
        e.preventDefault();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
            const hit = intersects[0].object;
            if (hit !== floor) {
                hit.material.color.set(Math.random() * 0xffffff);
            }
        }
    });

    // Обзор пальцем по экрану (замена движения мышки для телефона)
    let isTouching = false;
    let prevX = 0, prevY = 0;
    window.addEventListener('touchstart', (e) => {
        if (e.target.classList.contains('mob-btn')) return;
        isTouching = true;
        prevX = e.touches[0].clientX;
        prevY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
        if (!isTouching) return;
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const movementX = currentX - prevX;
        const movementY = currentY - prevY;
        prevX = currentX;
        prevY = currentY;

        euler.y -= movementX * 0.005;
        euler.x -= movementY * 0.005;
        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
        camera.quaternion.setFromEuler(euler);
    });
    window.addEventListener('touchend', () => { isTouching = false; });
</script>

</html>
